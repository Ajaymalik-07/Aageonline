# AageOnline — Multi-Service Production Docker Compose Configuration
# Independent Services: web (website:3000), api (api:4000), admin (admin:3001), worker, caddy
# Usage: docker compose -f docker-compose.yml --env-file .env.production up -d

services:
  # 1. Caddy Reverse Proxy & Automatic TLS Termination
  caddy:
    image: caddy:2.9-alpine
    container_name: aageonline_caddy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp" # HTTP/3 QUIC support
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    environment:
      - SITE_ADDRESS=${SITE_ADDRESS:-aageonline.com}
      - ACME_EMAIL=${ACME_EMAIL:-admin@aageonline.com}
    depends_on:
      web:
        condition: service_healthy
      api:
        condition: service_healthy
      admin:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:2019/config/ >/dev/null 2>&1 || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - aageonline-net
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "5"

  # 2. Public Website & Business Workspace (aageonline.com)
  web:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      target: web
    container_name: aageonline_web
    restart: unless-stopped
    expose:
      - "3000"
    environment:
      - PORT=3000
      - NEXT_PUBLIC_API_URL=https://api.${SITE_ADDRESS:-aageonline.com}
    env_file:
      - .env.production
    networks:
      - aageonline-net
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/api/health/live"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 15s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "5"

  # 3. Standalone Authoritative REST API Service (api.aageonline.com)
  api:
    build:
      context: ./api
      dockerfile: Dockerfile
    container_name: aageonline_api
    restart: unless-stopped
    expose:
      - "4000"
    environment:
      - PORT=4000
      - CORS_ORIGINS=https://${SITE_ADDRESS:-aageonline.com},https://www.${SITE_ADDRESS:-aageonline.com},https://admin.${SITE_ADDRESS:-aageonline.com}
    env_file:
      - .env.production
    networks:
      - aageonline-net
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:4000/api/health/live"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "5"

  # 4. Dedicated Admin Control Center (admin.aageonline.com)
  admin:
    build:
      context: ./admin
      dockerfile: Dockerfile
    container_name: aageonline_admin
    restart: unless-stopped
    expose:
      - "3001"
    environment:
      - PORT=3001
      - INTERNAL_API_URL=http://api:4000
      - NEXT_PUBLIC_API_URL=https://api.${SITE_ADDRESS:-aageonline.com}
      - NEXT_PUBLIC_WEBSITE_URL=https://${SITE_ADDRESS:-aageonline.com}
    env_file:
      - .env.production
    networks:
      - aageonline-net
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3001/api/health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 15s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "5"

  # 5. Dedicated Background Reconciler Worker
  worker:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      target: worker
    container_name: aageonline_worker
    restart: unless-stopped
    env_file:
      - .env.production
    networks:
      - aageonline-net
    healthcheck:
      test: ["CMD", "node", "--experimental-strip-types", "scripts/worker.ts", "--health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "5"

  # 6. Database Migrations One-Off Runner
  migrator:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      target: migrator
    container_name: aageonline_migrator
    profiles:
      - tools
    restart: "no"
    env_file:
      - .env.production
    networks:
      - aageonline-net

  # 7. Optional Same-Host PostgreSQL Database (Option A Architecture)
  # Activated only when using the "local-db" profile: docker compose --profile local-db up -d
  # When using Managed PostgreSQL (Option B Architecture), this service remains inactive.
  db:
    image: postgres:16-alpine
    container_name: aageonline_db
    restart: unless-stopped
    profiles:
      - local-db
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-aageonline}
      POSTGRES_USER: ${POSTGRES_USER:-aageonline}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - aageonline-net
    expose:
      - "5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-aageonline} -d ${POSTGRES_DB:-aageonline}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "5"

networks:
  aageonline-net:
    driver: bridge

volumes:
  caddy_data:
    name: aageonline_caddy_data
  caddy_config:
    name: aageonline_caddy_config
  pgdata:
    name: aageonline_pgdata
